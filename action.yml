name: "Workflow Status"
description: "Live per-job start/end workflow run reporting for a Push to Display board. Uses the same API as pushtodisplay/action."
author: "Goban Source, LLC"

branding:
  icon: "monitor"
  color: "blue"

inputs:
  phase:
    description: "Which end of the job this is: 'start' (first step) or 'end' (last step, if: always())."
    required: true
  api-key:
    description: "API key for authentication. Optional when the workflow or job sets env PUSH_TO_DISPLAY_API_KEY."
    required: false
  api-url:
    description: "Base URL of the Push to Display API. Override only for self-hosted instances or testing."
    required: false
    default: "https://api.pushtodisplay.com"
  board-id:
    description: "Board ID to push to. Optional when the workflow or job sets env PUSH_TO_DISPLAY_BOARD. Omit to use the account's default board."
    required: false
  panel-id:
    description: "Explicit panel ID (1-4). Overrides branch-based resolution."
    required: false
  prd-panel:
    description: "Panel ID used when the run is on the prd branch."
    required: false
    default: "1"
  dev-panel:
    description: "Panel ID used when the run is on any other branch."
    required: false
    default: "2"
  prd-branch:
    description: "Branch name treated as production."
    required: false
    default: "main"
  label:
    description: "Label shown on the board. Defaults to the workflow name."
    required: false
  steps-json:
    description: "Serialized steps context of the calling job (toJSON(steps)). Used by phase: end for the own job's exact conclusion, as computed by GitHub."
    required: false

outputs:
  panel-id:
    description: "The panel ID that was used"

runs:
  using: "node20"
  main: "main.js"
